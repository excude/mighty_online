/* ============================ 배팅 로직 ============================ */
function activeBidders(){
  return G.players.map(p=>p.id).filter(id=>!G.passedSet.has(id));
}
function nextBidder(from){
  let i=from;
  for(let k=0;k<5;k++){ i=(i+1)%5; if(!G.passedSet.has(i)) return i; }
  return null;
}
function bidRank(b){ return b.count*10; } // simple compare by count only (giruda choice doesn't add value here)

function aiEvaluateHand(hand){
  // 슈트별 강도 평가
  const scores={};
  for(const s of SUITS){
    let sc=0;
    const cards = hand.filter(c=>c!==JOKER && suitOf(c)===s);
    sc += cards.length*1.1;
    for(const c of cards){ const r=rankOf(c); if(r===14) sc+=3; else if(r===13) sc+=2; else if(r===12) sc+=1; }
    const mightyCard = (s==="S")? "D14":"S14";
    if(hand.includes(mightyCard)) sc+=4;
    if(hand.includes(JOKER)) sc+=2.5;
    scores[s]=sc;
  }
  let best="S", bestv=-1;
  for(const s of SUITS){ if(scores[s]>bestv){bestv=scores[s];best=s;} }
  return {suit:best, strength:bestv};
}

function aiDecideBid(playerId){
  const p = G.players[playerId];
  const ev = aiEvaluateHand(p.hand);
  const suggested = 12 + Math.round(ev.strength/2.6); // rough mapping
  const cur = G.highestBid;
  const curCount = cur? cur.count : 12;
  let want = Math.max(13, Math.min(20, suggested));
  if(!cur){
    if(want>=13) return {suit:ev.suit,count:Math.max(13,Math.min(want,20))};
    return null;
  }
  if(want > curCount && curCount<20){
    return {suit:ev.suit, count:Math.min(20,curCount+1)};
  }
  return null; // pass
}

function placeBid(playerId, bid){
  G.highestBid = {playerId, suit:bid.suit, count:bid.count};
  G.bidHistory.push(`${G.players[playerId].name}: ${suitBadge(bid.suit)}${bid.count}`);
  logMsg(`💬 ${G.players[playerId].name} → ${suitBadge(bid.suit)} ${bid.count}`);
}
function passBid(playerId){
  G.passedSet.add(playerId);
  G.bidHistory.push(`${G.players[playerId].name}: 패스`);
  logMsg(`💬 ${G.players[playerId].name} 패스`);
}

function scheduleBidStep(){
  if(!G) return; // 방어: "새 게임"으로 초기화된 뒤 지연 타이머가 실행되는 경우
  render();
  // 종료 조건: 활성 입찰자 1명 & 누군가 입찰한 적 있음 / 전원 패스
  const active = activeBidders();
  if(G.highestBid && active.length<=1){
    finishBidding();
    return;
  }
  if(!G.highestBid && active.length===0){
    // 전원 패스 -> 강제 최저입찰 지정
    const forced = Math.floor(Math.random()*5);
    G.passedSet.clear();
    G.highestBid = {playerId:forced, suit:SUITS[Math.floor(Math.random()*4)], count:13};
    logMsg(`⚠️ 전원 패스! ${G.players[forced].name}에게 최저 배팅(13)이 강제 배정됩니다.`);
    finishBidding();
    return;
  }
  const cur = G.bidTurn;
  if(G.passedSet.has(cur)){
    G.bidTurn = nextBidder(cur);
    scheduleBidStep();
    return;
  }
  if(active.length===1 && G.highestBid && active[0]===G.highestBid.playerId){
    finishBidding(); return;
  }
  const player = G.players[cur];
  if(player.isHuman && isLocalSeat(cur)){
    renderBiddingUI();
    if(online.host) onlineArmTimer(cur, "bidding");
  } else if(!player.isHuman) {
    if(onlineEnabled() && !online.host) return; // guest는 AI 턴을 직접 계산하지 않고 host의 broadcast를 기다린다
    setTimeout(()=>{
      if(!G) return; // 방어: "새 게임"으로 초기화된 뒤 지연 타이머가 실행되는 경우
      const bid = aiDecideBid(cur);
      if(bid) placeBid(cur,bid); else passBid(cur);
      G.bidTurn = nextBidder(cur);
      scheduleBidStep();
    }, 550);
  }
  // player.isHuman && !isLocalSeat(cur): 다른 사람(원격 플레이어)의 턴이므로 그 사람의 action 메시지를 기다린다
}

function humanBid(bid, pid=meId(), fromHost=false){
  if(onlineEnabled() && !online.host && !fromHost){ onlineSend({type:"action", action:{type:"bid", bid}, playerId:pid}); return; }
  if(G.bidTurn!==pid) return;
  if(bid==="pass"){ passBid(pid); }
  else { placeBid(pid,bid); }
  G.bidTurn = nextBidder(pid);
  closeModal();
  scheduleBidStep();
}

function finishBidding(){
  G.declarer = G.highestBid.playerId;
  G.giruda = G.highestBid.suit;
  G.mighty = (G.giruda==="S") ? "D14" : "S14";
  G.bidCount = G.highestBid.count;
  logMsg(`🏆 최종 낙찰: ${G.players[G.declarer].name} — ${girudaLabel(G.giruda)} / 목표 ${G.bidCount}`);
  G.phase="exchange";
  startExchange();
}

/* ============================ 카드 교환 (바닥패) ============================ */
function startExchange(){
  const d = G.players[G.declarer];
  d.hand = d.hand.concat(G.kitty);
  d.hand = sortHand(d.hand, G.giruda, G.mighty);
  if(d.isHuman && isLocalSeat(d.id)){
    G.exchangeSelected = new Set();
    if(online.host) onlineArmTimer(d.id, "exchange");
    renderExchangeUI();
  } else if(!d.isHuman) {
    if(onlineEnabled() && !online.host){ render(); return; }
    // AI: discard 3 weakest non-mighty/non-joker/non-giruda-high cards
    const hand = d.hand.slice();
    const scored = hand.map(c=>({c,v:cardWeight(c)}));
    scored.sort((a,b)=>a.v-b.v);
    const discard = scored.slice(0,3).map(x=>x.c);
    doExchange(discard);
  }
  render();
}
function cardWeight(c){
  if(c===G.mighty) return 1000;
  if(c===JOKER) return 950;
  if(c===jokerCallCard()) return 520; // 조커콜: 상대 조커를 끌어낼 수 있는 전략 카드라 낮은 카드보다는 신중히 사용
  if(suitOf(c)===G.giruda) return 500+rankOf(c);
  return rankOf(c);
}
function doExchange(discardCards, fromHost=false){
  if(onlineEnabled() && !online.host && !fromHost){ onlineSend({type:"action", action:{type:"exchange", cards:discardCards}, playerId:meId()}); return; }
  const d = G.players[G.declarer];
  d.hand = d.hand.filter(c=>!discardCards.includes(c));
  d.hand = sortHand(d.hand, G.giruda, G.mighty);
  logMsg(`🔄 ${josaGa(d.name)} 3장을 교체했습니다.`);
  G.phase="friend";
  startFriendSelection();
}

/* ============================ 프렌드 선택 ============================ */
function assessSoloStrength(hand, giruda, mighty){
  // 노프렌드(솔로)를 선언할 만큼 손패가 확실히 강한지 평가
  let score = 0;
  const girudaCards = giruda ? hand.filter(c=>c!==JOKER && suitOf(c)===giruda) : [];
  score += girudaCards.length * 1.3;
  for(const c of girudaCards){
    const r = rankOf(c);
    if(r===14) score+=3; else if(r===13) score+=2; else if(r===12) score+=1;
  }
  if(hand.includes(mighty)) score += 4;
  if(hand.includes(JOKER)) score += 3;
  for(const s of SUITS){
    if(s!==giruda){ const ace=s+"14"; if(hand.includes(ace)) score += 1; }
  }
  return score;
}

// 솔로(노프렌드)는 실패 시 벌점이 매우 크므로(주공 ×4) 정말 압도적으로 확실한 손패일 때만 선택하고,
// 그 외에는 안정적으로 내 손에 없는 카드 중에서 프렌드를 지목해 리스크를 분산한다.
const SOLO_STRENGTH_THRESHOLD = 21;
function aiChooseFriendCondition(hand){
  const candidates = [G.mighty, JOKER, ...SUITS.filter(s=>s!==G.giruda).map(s=>s+"14").filter(k=>k!==G.mighty)];
  const available = candidates.filter(c=>!hand.includes(c));
  if(available.length===0) return "SOLO"; // 지목할 카드가 전부 내 손에 있어 어쩔 수 없는 경우
  const strength = assessSoloStrength(hand, G.giruda, G.mighty);
  if(strength >= SOLO_STRENGTH_THRESHOLD) return "SOLO"; // 확실히 이길 수 있을 때만 의도적으로 솔로 선택
  return available[0];
}

function startFriendSelection(){
  const d = G.players[G.declarer];
  if(d.isHuman && isLocalSeat(d.id)){
    if(online.host) onlineArmTimer(d.id, "friend");
    renderFriendUI();
  } else if(!d.isHuman) {
    if(onlineEnabled() && !online.host){ render(); return; }
    applyFriend(aiChooseFriendCondition(d.hand));
  } else {
    render(); // 원격 플레이어의 프렌드 선택을 기다리는 동안에도 화면(phase 등)은 갱신
  }
}
function applyFriend(choice, fromHost=false){
  if(onlineEnabled() && !online.host && !fromHost){ onlineSend({type:"action", action:{type:"friend", choice}, playerId:meId()}); return; }
  G.friendMode = "card"; // 기본값: 특정 카드를 가진 사람이 프렌드
  if(choice==="SOLO"){
    G.solo=true; G.friendCard=null; G.friendPlayerId=null; G.friendRevealed=true; G.friendMode=null;
    logMsg(`🃏 ${G.players[G.declarer].name}: 프렌드 없이 단독 진행(솔로)!`);
  } else if(choice==="TRICK1"){
    G.friendMode = "trick1";
    G.friendCard=null; G.friendPlayerId=null; G.friendRevealed=false; G.solo=false;
    logMsg(`🤝 ${josaGa(G.players[G.declarer].name)} 초구 프렌드를 선언했습니다. (첫 트릭을 가져가는 사람이 프렌드, 주공이 직접 가져가면 노프렌드)`);
  } else if(choice==="TRICKLAST"){
    G.friendMode = "trickLast";
    G.friendCard=null; G.friendPlayerId=null; G.friendRevealed=false; G.solo=false;
    logMsg(`🤝 ${josaGa(G.players[G.declarer].name)} 막구 프렌드를 선언했습니다. (마지막 트릭을 가져가는 사람이 프렌드, 게임이 끝날 때까지 공개되지 않습니다)`);
  } else {
    G.friendCard = choice;
    const owner = G.players.find(p=>p.hand.includes(choice));
    G.friendPlayerId = owner? owner.id : null;
    if(owner && owner.id===G.declarer){
      G.solo=true; G.friendRevealed=true;
      logMsg(`🃏 프렌드 카드(${cardLabel(choice)})가 본인 손에 있어 자동 솔로 진행!`);
    } else {
      G.solo=false; G.friendRevealed=false;
      logMsg(`🤝 ${josaGa(G.players[G.declarer].name)} 프렌드 카드로 ${cardLabel(choice)}를 지목했습니다. (공개는 그 카드가 나올 때)`);
    }
  }
  G.phase="play";
  G.leader = G.declarer;
  G.trick=[]; G.ledSuit=null; G.trickNum=1;
  closeModal();
  render();
  scheduleTurn();
}

/* ============================ 플레이 로직 ============================ */
function cardLabel(c, showCallTag){
  if(c===JOKER) return "JOKER";
  if(showCallTag && c===jokerCallCard()) return SUIT_SYM[suitOf(c)]+RANK_LABEL[rankOf(c)]+"(콜)";
  return SUIT_SYM[suitOf(c)]+RANK_LABEL[rankOf(c)];
}
function validMoves(playerId){
  const hand = G.players[playerId].hand;
  let base;
  if(G.trick.length===0){
    base = hand.slice(); // leading: anything (subject to first-trick rule below)
  } else {
    // 조커콜(리퍼)이 이번 트릭의 선으로 나왔다면, 조커를 가진 사람은 무조건 조커를 내야 한다
    if(isJokerCallLed(G.trick) && hand.includes(JOKER)){
      return [JOKER];
    }
    const ledSuit = G.ledSuit;
    if(ledSuit===null){
      base = hand.slice(); // joker led -> free for all
    } else {
      const suitCards = hand.filter(c=> c!==JOKER && c!==G.mighty && suitOf(c)===ledSuit);
      if(suitCards.length>0){
        const opts = suitCards.slice();
        if(hand.includes(JOKER)) opts.push(JOKER);
        if(hand.includes(G.mighty)) opts.push(G.mighty);
        base = opts;
      } else if(hand.includes(G.mighty) && suitOf(G.mighty)===ledSuit){
        // 마이티는 원래 그 무늬(리드된 무늬)에 속한 카드이므로, 다른 그 무늬 카드가 없으면
        // 마이티가 곧 "그 무늬를 따라가는" 유일한 카드가 되어 마이티만 낼 수 있다 (조커도 예외 없음).
        base = [G.mighty];
      } else {
        base = hand.slice();
      }
    }
  }
  // 규칙: 첫 트릭에는 기루다를 낼 수 없다 (다른 낼 카드가 없을 때만 예외)
  if(G.giruda && G.trickNum===1){
    const noGiruda = base.filter(c=> c===JOKER || suitOf(c)!==G.giruda);
    if(noGiruda.length>0) base = noGiruda;
  }
  // 규칙: 첫 트릭에는 조커콜을 리드로 낼 수 없다 (다른 낼 카드가 없을 때만 예외)
  if(G.trickNum===1 && G.trick.length===0){
    const jc = jokerCallCard();
    const noCall = base.filter(c=> c!==jc);
    if(noCall.length>0) base = noCall;
  }
  return base;
}
function playCard(playerId, card, fromHost=false, suppressJokerCall=false){
  if(card===undefined || card===null){
    console.error("playCard: 유효하지 않은 카드 호출 무시", playerId, card);
    return;
  }
  if(onlineEnabled() && !online.host && !fromHost){ onlineSend({type:"action", action:{type:"play", card, suppressJokerCall}, playerId}); return; }
  const p = G.players[playerId];
  const ledThisTrick = (G.trick.length===0); // 조커콜은 선(리드)으로 냈을 때만 효력이 있다
  p.hand = p.hand.filter(c=>c!==card);
  const isCallLead = ledThisTrick && card===jokerCallCard() && !jokerAlreadyPlayed() && !suppressJokerCall;
  const noCallFlag = ledThisTrick && card===jokerCallCard() && suppressJokerCall;
  G.trick.push(noCallFlag ? {playerId,card,noCall:true} : {playerId,card});
  sfxPlay("card");
  if(G.trick.length===1){
    G.ledSuit = (card===JOKER) ? null : (card===G.mighty? suitOf(card) : suitOf(card));
    if(isCallLead){
      logMsg(`🔫 조커콜! 조커를 가진 사람은 이번 트릭에 조커를 내야 합니다.`);
      sfxPlay("jokercall");
    } else if(noCallFlag){
      logMsg(`${p.name}: 조커콜 카드를 그냥 일반 카드로 냈습니다.`);
    }
  }
  if(!G.friendRevealed && card===G.friendCard){
    G.friendRevealed=true;
    logMsg(`✨ 프렌드 공개! ${josaGa(p.name)} 프렌드였습니다.`);
  }
  logMsg(`▶ ${p.name}: ${cardLabel(card, isCallLead)}`);
  render();
}

function jokerTrickScore(){
  // 첫 트릭과 마지막 트릭에서는 조커가 가장 낮은 우선순위(사실상 승리 불가)
  if(G.trickNum===1 || G.trickNum===10) return -1;
  return 9000;
}

// 조커콜(리퍼): 기본은 클로버3, 기루다가 클로버면 스페이드3. 선(리드)으로 냈을 때만 효력이 있다.
function jokerCallCard(){
  return G.giruda==="C" ? "S3" : "C3";
}
// 조커가 이미 이전 트릭에서 나와 캡처됐는지 여부 (이미 나왔다면 조커콜은 더 이상 의미가 없다)
function jokerAlreadyPlayed(){
  for(const p of G.players){ if(p.won.includes(JOKER)) return true; }
  return false;
}
function isJokerCallLed(trick){
  return trick.length>0 && trick[0].card===jokerCallCard() && !trick[0].noCall && !jokerAlreadyPlayed();
}
// 트릭 내 카드 한 장의 승패 점수를 계산 (evalTrickWinner류 3곳에서 공통으로 사용)
function cardTrickScore(card, trick, ledSuit){
  if(card===G.mighty) return 10000;
  const callLed = isJokerCallLed(trick);
  if(card===JOKER){
    if(callLed) return 1; // 조커콜에 강제로 끌려나온 조커는 무력화되어 마이티 외엔 다 짐
    return jokerTrickScore();
  }
  // 조커콜 카드(클로버3/스페이드3) 자체는 조커를 무력화시키는 "신호"일 뿐, 트릭을 자동으로 이기지 않는다.
  // 즉 리드한 무늬(=조커콜 카드의 무늬)를 그대로 따라간 일반 카드로 취급해, 더 높은 같은 무늬 카드에는 진다.
  const suit=suitOf(card), rank=rankOf(card);
  if(G.giruda && suit===G.giruda) return 5000+rank;
  if(ledSuit!==null && suit===ledSuit) return 2000+rank;
  return 0;
}

function evalTrickWinner(){
  if(!G.trick.length) return -1; // 안전장치: 빈 트릭에 대해 호출되는 경우(중복 처리 등) NaN 전파 방지
  let bestScore=-1, bestPid=G.trick[0].playerId;
  for(const t of G.trick){
    const s = cardTrickScore(t.card, G.trick, G.ledSuit);
    if(s>bestScore){ bestScore=s; bestPid=t.playerId; }
  }
  return bestPid;
}

let resolvingTrick = false;
let aiTurnPending = false; // scheduleTurn()이 겹쳐 예약되어 같은 턴이 중복/꼬여 처리되는 것을 막는 락
function scheduleTurn(){
  if(!G) return; // 방어: "새 게임"으로 G가 초기화된 뒤 남아있던 예약 타이머가 뒤늦게 실행되는 경우
  render();
  if(G.trick.length===5){
    if(!resolvingTrick){
      resolvingTrick = true;
      setTimeout(resolveTrick, 900);
    }
    return;
  }
  const turnIdx = (G.leader + G.trick.length) % 5;
  const player = G.players[turnIdx];
  if(player.isHuman){
    if(online.host) onlineArmTimer(turnIdx, "play");
    // wait for UI click (or, for a remote human, their action message)
  } else {
    if(onlineEnabled() && !online.host) return; // guest는 AI 턴을 계산하지 않고 host의 broadcast를 기다린다
    if(aiTurnPending) return; // 이미 예약된 AI 턴이 있으면 중복 예약 방지
    aiTurnPending = true;
    setTimeout(()=>{
      aiTurnPending = false;
      if(!G) return; // 방어: 대기 중 "새 게임"으로 초기화된 경우
      if(G.trick.length>=5){ scheduleTurn(); return; } // 방어: 그 사이 트릭이 이미 다 찼다면 재조율만 하고 종료
      const mv = validMoves(turnIdx);
      if(!mv || !mv.length){
        scheduleTurn(); // 방어: 낼 카드가 없으면(비정상 상태) 조용히 재조율
        return;
      }
      const choice = aiPickCard(turnIdx, mv);
      if(choice===undefined || choice===null){
        scheduleTurn(); // 방어: 유효하지 않은 선택이면 카드를 내지 않고 재조율
        return;
      }
      const wasLead = G.trick.length===0;
      playCard(turnIdx, choice);
      if(wasLead && choice===JOKER && G.trickNum>1 && G.trickNum<10){
        const suit = aiChooseJokerCallSuit(turnIdx);
        G.ledSuit = suit;
        logMsg(`🃏 ${G.players[turnIdx].name}의 조커 선언: 이번 트릭은 ${SUIT_NAME[suit]} 기준으로 진행됩니다.`);
        render();
      }
      scheduleTurn();
    }, 500);
  }
}

function aiCardWeight(c){
  // 조커는 첫/마지막 트릭에서 이길 수 없지만, 그렇다고 먼저 버릴 카드는 아니다.
  // (다른 트릭에서는 마이티 다음으로 강력하므로 평소 가치를 그대로 유지해 아껴둔다)
  return cardWeight(c);
}

function teamOf(playerId){
  if(playerId===G.declarer) return "declarer";
  if(!G.solo && playerId===G.friendPlayerId) return "declarer";
  return "defender";
}

// 조커로 트릭을 리드했을 때(2~9트릭에서만 유효) AI가 선언할 기준 무늬를 정한다.
// 자신이 가장 적게 들고 있는 무늬를 불러, 상대가 그 무늬를 억지로 소진하게 유도한다.
function aiChooseJokerCallSuit(playerId){
  const hand = G.players[playerId].hand;
  const counts = {};
  for(const s of SUITS) counts[s] = hand.filter(c=>c!==JOKER && c!==G.mighty && suitOf(c)===s).length;
  let best=null, bestVal=Infinity;
  for(const s of SUITS){
    if(s===G.giruda) continue;
    if(counts[s]<bestVal){ bestVal=counts[s]; best=s; }
  }
  return best || G.giruda || SUITS[0];
}

// 현재 조커를 들고 있는 플레이어 id (이미 나왔으면 -1)
function jokerHolderId(){
  for(const p of G.players){ if(p.hand.includes(JOKER)) return p.id; }
  return -1;
}

function teamPointsSoFar(team){
  let pts=0;
  for(const p of G.players){ if(teamOf(p.id)===team) pts += p.won.filter(isScoreCard).length; }
  return pts;
}

// 우리 팀이 현재 페이스(진행된 트릭 수 대비)보다 점수패 획득이 뒤처져 있는지 판단
function teamIsBehindPace(playerId){
  const tricksPlayed = G.trickNum - 1; // 이번 트릭 이전에 끝난 트릭 수
  if(tricksPlayed<=0) return false;
  const team = teamOf(playerId);
  const target = Math.max(G.bidCount, 13);
  const teamPts = teamPointsSoFar(team);
  if(team==="declarer"){
    return teamPts < target * tricksPlayed/10;
  } else {
    const defTarget = 20 - target + 1; // 수비 팀이 막기 위해 필요한 점수패 수
    return teamPts < defTarget * tricksPlayed/10;
  }
}

// 지금 조커를 내야 하는지 판단: 1트릭/10트릭은 조커가 최하위라 의미 없고,
// 8트릭째까지 안 냈으면 이후엔 이길 기회 없이 10트릭(항상 패배)에 강제로 버려질 위험이 크므로 그 전에 써야 하며,
// 우리 팀이 페이스보다 뒤처져 있다면 확실한 승리 카드인 조커를 아끼지 말고 써야 한다.
function jokerUrgent(playerId){
  if(G.trickNum===1 || G.trickNum===10) return false;
  if(G.trickNum>=8) return true;
  if(teamIsBehindPace(playerId)) return true;
  return false;
}

// 조커가 8~9트릭까지 남아있으면, 이번 트릭을 이기지 못하더라도(즉 카드를 아껴봐야 소용없는 상황)
// 마지막 트릭까지 끌고 가면 무조건 지므로 이번 트릭에서 먼저 처리해 버린다.
function jokerRunningOutOfTime(){
  return G.trickNum>=8 && G.trickNum<10;
}

function aiChooseCard(playerId, moves){
  // 아주 단순한 휴리스틱: 리드면 안전한 낮은 카드나 마이티/조커 아끼기, 팔로우면 이길 수 있으면 최소로 이기고 아니면 최저값 버림
  const jokerNow = moves.includes(JOKER) && jokerUrgent(playerId);
  if(G.trick.length===0){
    // 조커가 급하면(9트릭 이상 방치 or 우리팀 열세) 확실한 승리 카드인 조커로 직접 리드
    if(jokerNow) return JOKER;
    // lead: prefer giruda low or highest non-mighty safe card
    const jc = jokerCallCard();
    const holder = jokerHolderId();
    // 조커가 우리 팀(나 자신 포함, 조커 프렌드인 주공팀 포함)에 있으면 조커콜로 우리 조커를 스스로 무력화시키지 않는다
    const callHurtsOwnTeam = holder!==-1 && teamOf(holder)===teamOf(playerId);
    let nonSpecial = moves.filter(c=>c!==G.mighty && c!==JOKER && !(callHurtsOwnTeam && c===jc));
    if(!nonSpecial.length){
      // 조커콜 카드 말고는 낼 게 없는 경우: 우리 팀 조커를 스스로 위협하는 조커콜보다는 차라리 마이티를 내는 편이 낫다
      if(callHurtsOwnTeam && moves.includes(G.mighty)){
        nonSpecial = [G.mighty];
      } else {
        nonSpecial = moves.filter(c=>c!==G.mighty && c!==JOKER); // 정말 어쩔 수 없으면 그때는 조커콜도 허용
      }
    }
    const pool = nonSpecial.length? nonSpecial: moves;
    pool.sort((a,b)=>aiCardWeight(a)-aiCardWeight(b));
    return pool[Math.random()<0.3?pool.length-1:0];
  }
  // 현재 트릭에서 누가 이기고 있는지 확인 — 같은 편이 이기고 있다면 굳이 뒤집으려 하지 않고 낮은 카드로 따라간다
  const currentLeaderId = evalTrickWinnerSim(G.trick);
  if(currentLeaderId!==playerId && teamOf(currentLeaderId)===teamOf(playerId)){
    // 이미 우리 편이 이기고 있는 트릭이면, 최강 카드인 마이티/조커는 다른 낼 카드가 있는 한 아껴서 낭비하지 않는다.
    const safe = moves.filter(c=>c!==G.mighty && c!==JOKER);
    const pool = safe.length? safe : moves;
    const sorted = pool.slice().sort((a,b)=>aiCardWeight(a)-aiCardWeight(b));
    // 이미 우리 편이 이기고 있어도, 8~9트릭에 조커를 계속 쥐고 있으면 결국 마지막 트릭에 갇혀 무조건 지므로 지금 처리한다.
    if(jokerRunningOutOfTime() && moves.includes(JOKER)) return JOKER;
    return sorted[0];
  }
  // simulate winning
  let winningMoves=[], losingMoves=[];
  for(const c of moves){
    const simTrick = G.trick.concat([{playerId,card:c}]);
    const w = evalTrickWinnerSim(simTrick, G.trick.length===0? (c===JOKER?null:suitOf(c)) : G.ledSuit);
    if(w===playerId) winningMoves.push(c); else losingMoves.push(c);
  }
  if(winningMoves.length){
    // 조커가 급한데 조커로 이길 수 있다면, 아끼지 말고 지금 확실히 챙긴다
    if(jokerNow && winningMoves.includes(JOKER)) return JOKER;
    winningMoves.sort((a,b)=>aiCardWeight(a)-aiCardWeight(b));
    return winningMoves[0];
  }
  losingMoves.sort((a,b)=>aiCardWeight(a)-aiCardWeight(b));
  // 8~9트릭인데 이번 트릭도 어차피 못 이기는 상황이면, 조커를 쥐고 있어봐야 마지막 트릭에서
  // 무조건 지는 카드로 갇히게 되므로 지금(=차이가 없는 트릭)에 먼저 던져서 처리한다.
  if(jokerRunningOutOfTime() && losingMoves.includes(JOKER)){
    return JOKER;
  }
  return losingMoves[0];
}
function evalTrickWinnerSim(trick, ledSuitOverride){
  if(!trick.length) return -1; // 안전장치: 빈 트릭 방어
  const ledSuit = (ledSuitOverride!==undefined)? ledSuitOverride : G.ledSuit;
  let bestScore=-1,bestPid=trick[0].playerId;
  for(const t of trick){
    const s = cardTrickScore(t.card, trick, ledSuit);
    if(s>bestScore){bestScore=s;bestPid=t.playerId;}
  }
  return bestPid;
}

/* ============================ 주공/프렌드 팀 전용 판단 로직 ============================
   여당(주공+프렌드) 소속 AI가 자기 차례를 결정할 때, 실제 게임 상태(G)는 이미 모든 플레이어의
   손패를 메모리상에 들고 있으므로, 이를 활용해 다양한 진행을 미리 시뮬레이션해보고
   자기 팀에게 가장 유리한 결과로 이어지는 카드를 선택한다. 화면/로그에는 아무것도 남기지 않으며
   실제 게임 상태(G)는 건드리지 않고 항상 복제본(snapshot) 위에서만 시뮬레이션한다. */
// 시뮬레이션을 하는 시점에 viewerId가 아직 직접 보지 못한(자기 손패도 아니고 이미 나온 카드도 아닌) 카드 목록.
// 팀메이트의 실제 손패를 추정할 때 이 풀에서 무작위로 뽑아 쓴다(상대팀 손패는 여전히 실제 정보를 그대로 사용).
function unseenCardsFor(viewerId){
  const seen = new Set(G.players[viewerId].hand);
  for(const p of G.players){ for(const c of p.won) seen.add(c); }
  for(const t of G.trick) seen.add(t.card);
  return makeDeck().filter(c=>!seen.has(c));
}
// viewerId 관점의 시뮬레이션 상태 복제본을 만든다.
// - 자기 자신의 손패: 실제 그대로
// - 그 외 모든 플레이어(팀메이트든 상대팀이든)의 손패: 전지적 정보를 쓰지 않고,
//   아직 보지 못한 카드 풀에서 무작위로 추정한 손패를 사용한다.
//   → 주공/프렌드 AI는 팀메이트뿐 아니라 상대팀 손패도 실제로 알지 못한 채 판단한다.
function cloneStateForSim(viewerId){
  const pool = shuffle(unseenCardsFor(viewerId));
  let idx = 0;
  return {
    players: G.players.map(p=>{
      let hand;
      if(p.id===viewerId){
        hand = p.hand.slice();
      } else {
        const n = p.hand.length;
        hand = pool.slice(idx, idx+n);
        idx += n;
      }
      return {id:p.id, isHuman:p.isHuman, hand, won:p.won.slice()};
    }),
    giruda: G.giruda, mighty: G.mighty, declarer: G.declarer, bidCount: G.bidCount,
    friendCard: G.friendCard, friendPlayerId: G.friendPlayerId, friendRevealed: G.friendRevealed, solo: G.solo, friendMode: G.friendMode,
    leader: G.leader, trick: G.trick.map(t=>t.noCall?{playerId:t.playerId, card:t.card, noCall:true}:{playerId:t.playerId, card:t.card}), ledSuit: G.ledSuit, trickNum: G.trickNum
  };
}
function simPlayCard(playerId, card){
  const p = G.players[playerId];
  p.hand = p.hand.filter(c=>c!==card);
  G.trick.push({playerId, card});
  if(G.trick.length===1){
    G.ledSuit = (card===JOKER) ? null : suitOf(card);
    if(card===JOKER && G.trickNum>1 && G.trickNum<10){
      G.ledSuit = aiChooseJokerCallSuit(playerId);
    }
  }
  if(!G.friendRevealed && card===G.friendCard) G.friendRevealed = true;
}
function simResolveTrick(){
  const winner = evalTrickWinner();
  const wp = G.players[winner];
  wp.won = wp.won.concat(G.trick.map(t=>t.card));
  G.trick=[]; G.ledSuit=null; G.leader=winner; G.trickNum++;
}
function simPlayOutRemainder(){
  let guard=0;
  while(guard++<200){
    if(G.trick.length===5){ simResolveTrick(); continue; }
    if(G.players.every(p=>p.hand.length===0)) break;
    const turnIdx = (G.leader + G.trick.length)%5;
    const mv = validMoves(turnIdx);
    if(!mv || !mv.length) break;
    simPlayCard(turnIdx, aiChooseCard(turnIdx, mv));
  }
}
// 후보 카드 하나를 냈다고 가정하고, 그 이후를 끝까지 시뮬레이션했을 때 우리 팀이 그 판을 이기는지(1) 지는지(0) 반환
function simRolloutWin(playerId, card){
  const backupG = G;
  const snapshot = cloneStateForSim(playerId);
  G = snapshot;
  try{
    simPlayCard(playerId, card);
    simPlayOutRemainder();
    const declarerTeam = new Set([G.declarer]);
    if(!G.solo && G.friendPlayerId!==null) declarerTeam.add(G.friendPlayerId);
    let teamPts=0;
    for(const p of G.players){ if(declarerTeam.has(p.id)) teamPts += p.won.filter(isScoreCard).length; }
    const target = Math.max(G.bidCount, 13);
    const declarerWin = teamPts>=target;
    const myTeam = teamOf(playerId);
    return (myTeam==="declarer") ? (declarerWin?1:0) : (declarerWin?0:1);
  } finally {
    G = backupG;
  }
}
// 주공/프렌드 팀 AI 전용 카드 선택: 전지적 정보(상대 실제 손패)를 전혀 들여다보지 않고,
// 자기 손패와 지금까지 나온 카드만으로 남은 카드들을 무작위로 추정해가며 여러 번 시뮬레이션한다.
// 후보로 낼 수 있는 카드마다 이렇게 여러 번 판을 끝까지 돌려본 뒤, 우리 팀이 이길 확률이
// 가장 높았던 카드를 선택한다 (몬테카를로 방식).
function aiChooseCardOmniscient(playerId, moves){
  if(!moves || moves.length===0) return null; // 방어: 낼 수 있는 카드가 없으면 절대 undefined를 반환하지 않는다
  if(moves.length===1) return moves[0];
  let candidateMoves = moves;
  // 첫 트릭에서는 조커가 항상 최하위로 무조건 진다(jokerTrickScore 참고).
  // 리드든 팔로우(버리는 카드)든, 다른 낼 카드가 있다면 가급적 조커를 첫 트릭에 내지 않는다.
  if(G.trickNum===1 && moves.includes(JOKER)){
    const noJoker = moves.filter(c=>c!==JOKER);
    if(noJoker.length>0) candidateMoves = noJoker;
  }
  // 조커콜(리퍼)을 리드로 낼 때, 우리 팀 조커를 스스로 무력화시키는 자충수는 피한다.
  // 상대 실제 손패는 몰라도 되고, 오직 "공개된 정보"만으로 판단한다:
  //  - 내 손에 조커가 있다 (자기 자신의 패이므로 당연히 아는 정보)
  //  - 또는 프렌드 카드가 조커로 지목되어 있다 (공개 선언이므로, 조커는 규칙상 항상 우리 팀에 있음이 보장됨)
  if(G.trick.length===0){
    const jc = jokerCallCard();
    if(jc && candidateMoves.includes(jc)){
      const iHoldJoker = G.players[playerId].hand.includes(JOKER);
      const jokerGuaranteedOwnTeam = (G.friendCard===JOKER);
      if(iHoldJoker || jokerGuaranteedOwnTeam){
        const noCall = candidateMoves.filter(c=>c!==jc);
        if(noCall.length>0) candidateMoves = noCall;
      }
    }
  }
  // 8~9트릭까지 조커를 계속 쥐고 있으면 마지막(10) 트릭에 갇혀 무조건 지는 카드가 되어버린다.
  // 이건 상대 패를 몰라도 트릭 번호만으로 알 수 있는 규칙상 사실이므로, 이때는 지금 확실히 처리한다.
  if(jokerRunningOutOfTime() && candidateMoves.includes(JOKER)) return JOKER;
  const ROLLOUTS = 24;
  let bestCard = candidateMoves[0], bestWinRate = -Infinity;
  for(const card of candidateMoves){
    let wins=0;
    for(let i=0;i<ROLLOUTS;i++) wins += simRolloutWin(playerId, card);
    const rate = wins/ROLLOUTS;
    if(rate > bestWinRate + 1e-9){ bestWinRate = rate; bestCard = card; }
  }
  return bestCard;
}
function aiPickCard(playerId, moves){
  if(!G.players[playerId].isHuman && teamOf(playerId)==="declarer"){
    return aiChooseCardOmniscient(playerId, moves);
  }
  return aiChooseCard(playerId, moves);
}

function resolveTrick(){
  if(!G) { resolvingTrick = false; return; } // 방어: "새 게임"으로 초기화된 뒤 지연 타이머가 실행되는 경우
  if(onlineEnabled() && !online.host){ resolvingTrick=false; return; } // guest는 트릭 판정을 직접 하지 않는다 (host의 broadcast로 반영)
  resolvingTrick = false;
  if(G.trick.length!==5) return; // 안전장치: 이미 처리된 트릭이면 무시(중복 실행 방지)
  const winner = evalTrickWinner();
  const wp = G.players[winner];
  wp.won = wp.won.concat(G.trick.map(t=>t.card));
  logMsg(`🏅 ${josaGa(wp.name)} 트릭을 가져갑니다.`);
  sfxPlay("trick");
  flashWinner(wp.name);
  // 초구 프렌드: 첫 트릭(트릭넘버가 아직 1일 때, 즉 증가 전)의 승자가 프렌드로 확정된다.
  if(G.friendMode==="trick1" && G.trickNum===1 && !G.friendRevealed){
    if(winner===G.declarer){
      G.solo=true; G.friendRevealed=true;
      logMsg(`🃏 초구를 주공이 직접 가져가 노프렌드(솔로)로 진행됩니다!`);
    } else {
      G.friendPlayerId=winner; G.friendRevealed=true;
      logMsg(`✨ 초구 프렌드 공개! ${josaGa(wp.name)} 프렌드였습니다.`);
    }
  }
  G.trick=[]; G.ledSuit=null; G.leader=winner; G.trickNum++;
  const gameOver = G.players.every(p=>p.hand.length===0);
  // 막구 프렌드: 마지막 트릭의 승자가 프렌드로 확정된다. 게임이 끝날 때까지 정체가 공개되지 않는다.
  if(gameOver && G.friendMode==="trickLast" && !G.friendRevealed){
    if(winner===G.declarer){
      G.solo=true; G.friendRevealed=true;
      logMsg(`🃏 막구를 주공이 직접 가져가 노프렌드(솔로)로 처리됩니다!`);
    } else {
      G.friendPlayerId=winner; G.friendRevealed=true;
      logMsg(`✨ 막구 프렌드 공개! ${josaGa(wp.name)} 프렌드였습니다.`);
    }
  }
  if(gameOver){
    setTimeout(finishGame, 700);
    return;
  }
  setTimeout(scheduleTurn, 700);
}

function flashWinner(name){
  const el = document.getElementById("trickWinnerFlash");
  el.textContent = `${name} 승!`;
  el.style.opacity=1;
  setTimeout(()=>{el.style.opacity=0;}, 800);
}

/* ============================ 종료 및 결과 (점수 계산) ============================ */
function finishGame(){
  if(!G) return; // 방어: "새 게임"으로 초기화된 뒤 지연 타이머가 실행되는 경우
  if(onlineEnabled() && !online.host) return; // guest는 결과 계산을 직접 하지 않는다 (host의 broadcast로 반영)
  const declarerTeam = new Set([G.declarer]);
  if(!G.solo && G.friendPlayerId!==null) declarerTeam.add(G.friendPlayerId);
  let teamPts=0, oppPts=0;
  for(const p of G.players){
    const pts = p.won.filter(isScoreCard).length;
    if(declarerTeam.has(p.id)) teamPts+=pts; else oppPts+=pts;
  }
  // 최소 공약 점수(13) 보장: 공약이 13 미만으로 강제 배정된 예외적인 경우에도 13을 기준으로 계산
  const target = Math.max(G.bidCount, 13);
  const win = teamPts >= target;
  const base = win ? (teamPts - target + (target-13)*2) : (target - teamPts);
  // 순수 마진(목표 대비 초과/부족 점수패 수): 판돈 계산용 base와 달리 공약 프리미엄((target-13)*2)을 포함하지 않는다.
  // XP의 "압승 보너스"/"완패 페널티"는 실제로 얼마나 크게 이기거나 졌는지를 반영해야 하므로 이 값을 사용한다.
  const margin = win ? (teamPts - target) : (target - teamPts);
  const isNoTrump = (G.giruda===null);
  const isRun = win && teamPts===20;          // 런: 여당이 20장(전체 점수패)을 모두 획득
  const isBaekRun = !win && teamPts<10;        // 백런: 여당이 10장 미만(절반 미만)만 획득한 채 패배
  let unit = base;
  if(isNoTrump) unit *= 2;
  if(isRun) unit *= 2;
  if(isBaekRun) unit *= 2;
  const declarerMult = G.solo? 4 : 2; // 노프렌드 주공: ×4, 프렌드 있음: ×2
  const declarerDelta = win? unit*declarerMult : -unit*declarerMult;
  const friendDelta = (!G.solo)? (win? unit : -unit) : null;
  const defenderDelta = win? -unit : unit;

  const deltas = {};
  deltas[G.declarer] = declarerDelta;
  if(!G.solo && G.friendPlayerId!==null) deltas[G.friendPlayerId] = friendDelta;
  for(const p of G.players){
    if(!declarerTeam.has(p.id)) deltas[p.id] = defenderDelta;
  }
  for(const pid in deltas){
    matchState.scores[pid] = (matchState.scores[pid]||0) + deltas[pid];
  }

  G.phase="result";
  G.result = {teamPts, oppPts, success:win, declarerTeam:[...declarerTeam], base, unit, margin, isNoTrump, isRun, isBaekRun, deltas, target};

  matchState.nextDealer = (G.dealer+1)%5;
  matchState.resultSeq = (matchState.resultSeq||0) + 1;
  applyRoundResultToLocalProfile(); // host 자신의 이번 판 결과를 host 자신의 로컬 프로필(레벨/XP)에 반영
  matchState.history.push({
    round: matchState.currentRound,
    declarer: G.players[G.declarer].name,
    giruda: G.giruda, count: G.bidCount,
    solo: G.solo,
    friend: (!G.solo && G.friendPlayerId!==null)? G.players[G.friendPlayerId].name : null,
    teamPts, oppPts, success:win, myWin: G.result.myWin,
    teamNames: declarerTeam.size? [...declarerTeam].map(id=>G.players[id].name) : [],
    deltas: {...deltas},
    scoresAfter: matchState.scores.slice()
  });
  render();
  renderResultUI();
}

function hasNextRound(){
  if(matchState.endMode==="bust"){
    return !matchState.scores.some(s=>s<=0);
  }
  return matchState.currentRound < matchState.totalRounds;
}

/* ============================ 렌더링 ============================ */
function render(){
  if(!G) return; // 방어: "새 게임"으로 G가 초기화된 뒤 지연 타이머 등이 뒤늦게 호출하는 경우
  renderTopbar();
  renderSeats();
  renderTrick();
  renderHand();
  renderMyScoreCards();
  renderActionBar();
  onlineRenderTimer();
  queueSave();
  if(online.host) broadcastOnlineState();
}

function renderMyScoreCards(){
  const el = document.getElementById("myScoreCards");
  if(!el) return;
  if(shouldShowScoreCards(0)){
    const cards = G.players[meId()].won.filter(isScoreCard);
    el.innerHTML = cards.length
      ? cards.map(c=>`<span class="chip ${cardColor(c)}">${cardLabel(c)}</span>`).join("")
      : `<span style="font-size:9px;color:#f6f1e455;">득점패 없음</span>`;
  } else {
    el.innerHTML = "";
  }
}

function friendConditionLabel(){
  if(G.solo) return "프렌드 없음";
  if(G.friendMode==="trick1") return "초구 프렌드";
  if(G.friendMode==="trickLast") return "막구 프렌드";
  if(!G.friendCard) return "";
  if(G.friendCard===G.mighty) return "마이티 프렌드";
  if(G.friendCard===JOKER) return "조커 프렌드";
  return `${cardLabel(G.friendCard)} 프렌드`;
}

// 주공팀이 아닌(또는 아직 정체가 공개되지 않은) 플레이어는 점수패를 캐릭터 앞에 공개해 점수 파악을 돕는다.
// 프렌드는 공개되기 전까지는(정체를 모르므로) 점수패를 보여주고, 공개된 순간부터는 주공팀으로 확정되어 숨긴다.
function shouldShowScoreCards(playerId){
  if(G.phase!=="play" && G.phase!=="result") return false;
  if(playerId===G.declarer) return false;
  if(G.solo) return true;
  if(playerId===G.friendPlayerId) return !G.friendRevealed;
  return true;
}

function renderTopbar(){
  const map={bidding:"배팅 중",exchange:"카드 교환",friend:"프렌드 지목",play:"플레이 중",result:"결과"};
  document.getElementById("phaseTag").textContent = `${roundLabel()} · ${map[G.phase]||""}`;

  const strip = document.getElementById("statusStrip");
  const badges = [];
  badges.push(`<span class="status-badge level">🎖 Lv.${profile.level} · ${Math.round(profile.xp)}/${xpToNextLevel(profile.level)}xp</span>`);
  if(G.phase==="play" && G.trickNum===1){
    badges.push(`<span class="status-badge warn">⚠ 첫 트릭: 조커 최하위 · 기루다 낼 수 없음</span>`);
  } else if(G.phase==="play" && G.trickNum===10){
    badges.push(`<span class="status-badge warn">⚠ 마지막 트릭: 조커 최하위</span>`);
  }
  const scoreStr = G.players.map(p=>`${p.name} ${matchState.scores[p.id]}`).join(" · ");
  badges.push(`<span class="status-badge">💰 ${scoreStr}</span>`);
  if(G.phase==="play"||G.phase==="result"){
    badges.push(`<span class="status-badge friend">🤝 ${friendConditionLabel()}</span>`);
    badges.push(`<span class="status-badge giruda">${G.giruda===null? "노 기루다" : suitBadge(G.giruda)+" "+girudaLabel(G.giruda)}</span>`);
    badges.push(`<span class="status-badge">공약 ${G.bidCount}점 · 주공 ${G.players[G.declarer].name}${G.solo?' (솔로)':''}</span>`);
    if(G.trickNum<=10) badges.push(`<span class="status-badge">트릭 ${G.trickNum}/10</span>`);
  }
  strip.innerHTML = badges.join("");
}

function renderSeats(){
  const table = document.getElementById("table");
  table.querySelectorAll(".seat").forEach(e=>e.remove());
  for(let slot=1;slot<5;slot++){
    const i = (meId()+slot)%5; // 실제(절대) 좌석 번호 — 화면상으로는 내 자리(meId)가 항상 하단에 오도록 회전
    const p = G.players[i];
    const seat = document.createElement("div");
    seat.className="seat";
    const pos = seatPercent(slot, 38, 34);
    seat.style.left = pos.x+"%";
    seat.style.top = pos.y+"%";
    const turnIdx = (G.phase==="play")? (G.leader + G.trick.length)%5 : (G.phase==="bidding"? G.bidTurn : -1);
    if(turnIdx===i) seat.classList.add("turn");
    let badges = "";
    if(G.declarer===i) badges += `<div class="declarer-badge">주공</div>`;
    if(G.friendRevealed && G.friendPlayerId===i && !G.solo) badges += `<div class="friend-badge">프렌드</div>`;
    let scoreHtml = "";
    if(shouldShowScoreCards(i)){
      const scoreCards = p.won.filter(isScoreCard);
      if(scoreCards.length){
        scoreHtml = `<div class="scorecards">${scoreCards.map(c=>`<span class="chip ${cardColor(c)}">${cardLabel(c)}</span>`).join("")}</div>`;
      } else {
        scoreHtml = `<div class="scorecards empty">득점패 없음</div>`;
      }
    }
    seat.innerHTML = `
      <div class="avatar">${p.name[0]}${badges}</div>
      <div class="name">${p.name}</div>
      <div class="tag">${G.declarer===i? (G.solo?'솔로 주공':'주공') : ''}</div>
      <div class="cardcount">${p.hand.length}장</div>
      ${scoreHtml}
    `;
    table.appendChild(seat);
  }
}

let renderedTrickCount = 0;
function currentTrickLeadingIndex(){
  if(!G.trick.length) return -1;
  let bestScore=-1, bestIdx=0;
  G.trick.forEach((t,idx)=>{
    const s = cardTrickScore(t.card, G.trick, G.ledSuit);
    if(s>bestScore){ bestScore=s; bestIdx=idx; }
  });
  return bestIdx;
}

function renderTrick(){
  const area = document.getElementById("trickArea");
  if(G.trick.length < renderedTrickCount){
    // 새 트릭 시작(초기화)
    area.innerHTML = "";
    renderedTrickCount = 0;
  }
  const SETTLE_R = 52, START_R = 165;
  // 이미 자리잡은 카드는 그대로 둔다 (재애니메이션 방지)
  for(let idx=renderedTrickCount; idx<G.trick.length; idx++){
    const t = G.trick[idx];
    const div = document.createElement("div");
    div.className="trickcard";
    const start = seatOffsetPx(seatSlot(t.playerId), START_R);
    const end = seatOffsetPx(seatSlot(t.playerId), SETTLE_R);
    div.style.transform = `translate(${start.x}px, ${start.y}px) scale(.7)`;
    div.appendChild(buildCardEl(t.card,false));
    area.appendChild(div);
    // 다음 프레임에 목표 위치로 슬라이드
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        div.style.transform = `translate(${end.x}px, ${end.y}px) scale(1)`;
        div.classList.add("settled");
      });
    });
  }
  renderedTrickCount = G.trick.length;
  // 현재 트릭에서 이기고 있는 카드에 빛나는 테두리 표시
  const leadIdx = currentTrickLeadingIndex();
  const cardEls = area.querySelectorAll(".trickcard");
  cardEls.forEach((el,idx)=>{ el.classList.toggle("leading", idx===leadIdx && G.trick.length>0); });
}

function buildCardEl(card, mini){
  const el = document.createElement("div");
  el.className = "card mini" + (card===JOKER? " joker":"") + " " + (card===JOKER? "black": cardColor(card));
  if(card===JOKER){
    el.innerHTML = `<div class="r">★</div><div class="s">JOKER</div><div class="r bottom">★</div>`;
  } else {
    const s = SUIT_SYM[suitOf(card)], r = RANK_LABEL[rankOf(card)];
    el.innerHTML = `<div class="r">${r}<br>${s}</div><div class="s">${s}</div><div class="r bottom">${r}<br>${s}</div>`;
  }
  // 마이티/기루다/조커콜 표시: 누구의 카드든, 손패든 트릭에 깔린 카드든 항상 동일하게 표시
  if(G){
    if(G.mighty && card===G.mighty) el.classList.add("is-mighty");
    if(G.giruda && card!==JOKER && suitOf(card)===G.giruda) el.classList.add("is-giruda");
    // 조커콜은 기루다가 정해진 뒤(G.mighty가 정해진 시점)부터, 조커가 아직 나오지 않았을 때만 유효하다
    if(G.mighty && !jokerAlreadyPlayed() && card===jokerCallCard()) el.classList.add("is-jokercall");
  }
  return el;
}

function renderHand(){
  const hand = document.getElementById("hand");
  hand.innerHTML="";
  const me = G.players[meId()];
  document.getElementById("handHint").textContent = `${me.hand.length}장`;
  let selectable = [];
  if(G.phase==="play" && G.trick.length<5){
    const turnIdx = (G.leader + G.trick.length)%5;
    if(turnIdx===meId()) selectable = validMoves(meId());
  } else if(G.phase==="exchange" && G.declarer===meId()){
    selectable = me.hand.slice();
  }
  me.hand.forEach(card=>{
    const el = buildCardEl(card,false);
    el.classList.remove("mini");
    const canPick = selectable.includes(card);
    if(canPick) el.classList.add("selectable");
    if(G.phase==="exchange" && G.exchangeSelected && G.exchangeSelected.has(card)) el.classList.add("chosen");
    if(!canPick && (G.phase==="play")) el.classList.add("disabled");
    el.addEventListener("click", ()=>onHandCardClick(card));
    hand.appendChild(el);
  });
  // 카드가 늘어나 화면 폭을 넘치면(예: 주공이 바닥패 3장을 받는 경우) 왼쪽 카드가
  // 가려지지 않도록 왼쪽 정렬 모드로 전환하고 스크롤 위치를 맨 왼쪽으로 초기화한다.
  requestAnimationFrame(()=>{
    if(!hand.isConnected) return;
    const overflowing = hand.scrollWidth > hand.clientWidth + 1;
    hand.classList.toggle("overflowing", overflowing);
    if(overflowing) hand.scrollLeft = 0;
  });
}

function onHandCardClick(card){
  if(G.phase==="play"){
    if(G.trick.length>=5) return; // 5장이 모인 트릭은 판정 대기 중이므로 추가 입력 무시 (경합 방지)
    const turnIdx = (G.leader + G.trick.length)%5;
    if(turnIdx!==meId()) return;
    const mv = validMoves(meId());
    if(!mv.includes(card)) return;
    const wasLead = G.trick.length===0;
    const isJokerCallLeadAttempt = wasLead && card===jokerCallCard() && !jokerAlreadyPlayed();
    const proceed = (suppress)=>{
      playCard(meId(), card, false, suppress);
      if(wasLead && card===JOKER && G.trickNum>1 && G.trickNum<10){
        openJokerLeadSuitPicker(()=>scheduleTurn());
      } else {
        scheduleTurn();
      }
    };
    if(isJokerCallLeadAttempt){
      openJokerCallConfirm(card, (useCall)=> proceed(!useCall));
    } else {
      proceed(false);
    }
  } else if(G.phase==="exchange" && G.declarer===meId()){
    if(!G.exchangeSelected) G.exchangeSelected = new Set();
    if(G.exchangeSelected.has(card)) G.exchangeSelected.delete(card);
    else { if(G.exchangeSelected.size>=3) return; G.exchangeSelected.add(card); }
    renderHand();
    renderActionBar();
  }
}

// 사람이 조커로 트릭을 리드했을 때(2~9트릭) 기준 무늬를 직접 선택하게 하는 모달
function openJokerLeadSuitPicker(onDone){
  const suitHtml = SUITS.map(s=>`<div class="suit-opt ${SUIT_COLOR[s]}" data-suit="${s}">${SUIT_SYM[s]}<div style="font-size:9px;margin-top:2px;">${SUIT_NAME[s]}</div></div>`).join("");
  openModal(`
    <h2>🃏 조커 선언!</h2>
    <p class="sub">조커로 트릭을 시작했습니다. 이번 트릭의 기준 무늬를 선택하세요.</p>
    <div class="row" id="jokerSuitRow">${suitHtml}</div>
  `, true);
  document.querySelectorAll("#jokerSuitRow .suit-opt").forEach(el=>{
    el.onclick = ()=>{
      const suit = el.dataset.suit;
      if(onlineEnabled() && !online.host){
        // 게스트는 직접 G.ledSuit를 바꾸지 않는다(어차피 다음 broadcast로 덮어써진다).
        // 대신 고른 무늬를 host에게 액션으로 보내고, host가 반영해 다시 broadcast하면
        // 그 결과가 화면에 반영된다.
        onlineSend({type:"action", action:{type:"jokerLeadSuit", suit}, playerId:meId()});
      } else {
        G.ledSuit = suit;
        logMsg(`🃏 조커 선언: 이번 트릭은 ${SUIT_NAME[suit]} 기준으로 진행됩니다.`);
      }
      closeModal();
      onDone();
    };
  });
}

  }).join("");

  const hasNext = hasNextRound();
  const busted = matchState.endMode==="bust" ? matchState.scores.some(s=>s<=0) : false;
  const nextLabel = hasNext? `다음 판 시작` : "매치 결과 보기";
  const myTeamLabel = r.myTeam==="declarer" ? "주공팀(나)" : "야당(나)";
  const winnerLabel = (r.myTeam==="declarer" ? "주공팀" : "야당") + (r.myWin ? " 승리" : " 패배");
  openModal(`
    <h2 style="margin-bottom:2px;">${matchState.currentRound}판 결과</h2>
    <div class="resultBig ${r.myWin?'win':'lose'}" style="margin:2px 0 4px;font-size:24px;">${winnerLabel} ${r.myWin?'🎉':''}</div>
    <p class="sub" style="text-align:center;margin-bottom:8px;">내 소속: ${myTeamLabel} &nbsp;·&nbsp; 주공팀 획득 ${r.teamPts}점 / 공약 ${G.bidCount}점, ${girudaLabel(G.giruda)}</p>
    <table class="scoreTable compact" style="margin-bottom:8px;">
      <tr><th>플레이어</th><th>가져온 카드</th><th>득점 카드</th></tr>
      ${rows}
    </table>
    <p class="sub" style="margin-bottom:4px;">점수 계산: ${formulaLine} → 배수 ${tags.join(" · ")} 적용</p>
    <table class="scoreTable compact" style="margin-bottom:6px;">
      <tr><th>플레이어</th><th>이번 판</th><th>누적 점수</th></tr>
      ${scoreRows}
    </table>
    ${busted? `<p class="sub" style="color:#ef7d7d;text-align:center;margin-bottom:6px;">⚠ 점수가 소진된 플레이어가 발생해 매치가 종료됩니다.</p>`:""}
    <div class="modal-actions"><button class="btn" id="restartBtn">경험치 확인 →</button></div>
  `);
  document.getElementById("restartBtn").onclick = ()=>{
    closeModal();
    renderXpModal(()=>{ if(hasNext){ newGame(); } else { renderMatchSummaryUI(); } });
  };
}

function renderXpModal(onDone){
  const r = G.result;
  const startLevel = r.xpStartLevel, startXp = r.xpStartXp;
  const endLevel = profile.level, endXp = profile.xp;
  const leveledUp = r.xpLevelUps && r.xpLevelUps.length>0;
  const leveledDown = r.xpLevelDowns && r.xpLevelDowns.length>0;
  if(leveledUp) setTimeout(()=>sfxPlay("levelup"), 850); // 레벨업 배너가 뜨는 타이밍(0.35s 지연 애니메이션)에 맞춰 재생
  if(leveledDown) setTimeout(()=>sfxPlay("lose"), 850);
  const startPct = levelProgressPercent(startLevel, startXp);
  // 레벨업이 있으면 최종적으로는 "새 레벨"에서의 진행률을 목표로 애니메이션
  const finalPct = levelProgressPercent(endLevel, endXp);

  const breakdownHtml = r.xpBreakdown.map((b,i)=>
    `<div class="xpRow" style="animation-delay:${0.5 + i*0.12}s"><span>${b.label}</span><span class="amt" style="${b.amount<0?'color:#ef7d7d;':''}">${b.amount>=0?'+':''}${b.amount}</span></div>`
  ).join("");

  const confettiEmojis = ["🎉","✨","🎊","⭐","💫"];
  const confettiHtml = leveledUp ? Array.from({length:16}).map((_,i)=>{
    const left = Math.round(Math.random()*100);
    const delay = (Math.random()*0.4).toFixed(2);
    const emoji = confettiEmojis[i%confettiEmojis.length];
    return `<span class="confetti" style="left:${left}%; animation-delay:${delay}s;">${emoji}</span>`;
  }).join("") : "";

  openModal(`
    <div class="xpModal">
      <h2 style="text-align:center;">${r.xpGain>=0? '경험치 획득!' : '경험치 감소'}</h2>
      ${leveledUp ? `<div class="confettiWrap">${confettiHtml}</div>` : ""}
      <div class="xpGainText" style="${r.xpGain<0?'color:#ef7d7d;':''}">${r.xpGain>=0?'+':''}${r.xpGain} XP</div>
      ${r.streak>=2 ? `<div class="xpStreak">🔥 ${r.streak}연승 중!</div>` : ""}
      ${leveledUp ? `<div class="levelUpBanner">🎉 LEVEL UP! Lv.${startLevel} → Lv.${endLevel} 🎉</div>` : ""}
      ${leveledDown ? `<div class="levelUpBanner" style="background:linear-gradient(90deg,#c97a7a,#e8a8a8,#c97a7a);color:#3a0a0a;">📉 LEVEL DOWN. Lv.${startLevel} → Lv.${endLevel}</div>` : ""}
      <div class="xpLevelRow">
        <div class="xpLevelBadge" id="xpLevelBadge">
          <div class="lv-num" id="xpLevelNum">${startLevel}</div>
          <div class="lv-label">LEVEL</div>
        </div>
        <div class="xpBarWrap">
          <div class="xpBarLabel"><span id="xpBarLabelText">${Math.round(startXp)} / ${xpToNextLevel(startLevel)} XP</span><span>Lv.${startLevel===endLevel? endLevel : (startLevel+' → '+endLevel)}</span></div>
          <div class="xpBarTrack"><div class="xpBarFill" id="xpBarFill" style="width:${startPct}%"></div></div>
        </div>
      </div>
      <div class="xpBreakdown">${breakdownHtml}</div>
      <p class="sub" style="text-align:center;">누적 ${profile.totalWins}승 / ${profile.totalGames}판 · 최고 연승 ${profile.bestStreak}회</p>
      <div class="modal-actions"><button class="btn" id="xpContinueBtn">계속하기</button></div>
    </div>
  `);

  // 애니메이션: 바 채우기 + 레벨업이면 중간에 배지 튕기고 리셋 후 다시 채움
  const fill = document.getElementById("xpBarFill");
  const badge = document.getElementById("xpLevelBadge");
  const lvNum = document.getElementById("xpLevelNum");
  const labelText = document.getElementById("xpBarLabelText");
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      if(!leveledUp){
        if(fill) fill.style.width = finalPct + "%";
        if(labelText) labelText.textContent = `${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
      } else {
        // 1단계: 이전 레벨 바를 100%까지 채움
        if(fill) fill.style.width = "100%";
        setTimeout(()=>{
          if(badge){ badge.classList.add("leveling"); }
          if(lvNum) lvNum.textContent = endLevel;
          if(fill){ fill.style.transition = "none"; fill.style.width = "0%"; }
          setTimeout(()=>{
            if(fill){
              fill.style.transition = "width 0.9s cubic-bezier(.2,.8,.3,1)";
              fill.style.width = finalPct + "%";
            }
            if(labelText) labelText.textContent = `${Math.round(endXp)} / ${xpToNextLevel(endLevel)} XP`;
          }, 60);
        }, 950);
      }
    });
  });

  document.getElementById("xpContinueBtn").onclick = ()=>{ closeModal(); onDone(); };
}

function renderMatchSummaryUI(){
  // h.myWin은 그 판을 계산한 host 자신의 시점 값이라, 게스트가 그대로 쓰면
  // 내가 아니라 host의 승패가 표시되는 문제가 있다. 라운드마다 저장해둔
  // teamNames/declarer(이름 목록)로 "내 이름"이 그 판의 주공팀에 있었는지를
  // 이 기기에서 다시 계산해서 보여준다.
  const myName = G.players[meId()].name;
  const rows = matchState.history.map(h=>{
    const teamStr = h.solo? `${h.declarer}(솔로)` : (h.teamNames? h.teamNames.join(", ") : h.declarer);
    const myWasDeclarerTeam = h.solo ? (h.declarer===myName) : (h.teamNames && h.teamNames.includes(myName));
    const myWinRow = myWasDeclarerTeam ? h.success : !h.success;
    return `<tr><td>${h.round}</td><td>${teamStr}</td><td>${suitBadge(h.giruda)}${h.count}</td><td>${h.teamPts}:${h.oppPts}</td><td>${myWinRow?'✅ 승리':'❌ 패배'}</td></tr>`;
  }).join("");
  const myWins = matchState.history.filter(h=>{
    const myWasDeclarerTeam = h.solo ? (h.declarer===myName) : (h.teamNames && h.teamNames.includes(myName));
    return myWasDeclarerTeam ? h.success : !h.success;
  }).length;
  const finalScoreRows = G.players.map(p=>`<tr><td>${p.name}</td><td>${matchState.scores[p.id]}점</td></tr>`).join("");
  const maxScore = Math.max(...matchState.scores);
  const winners = G.players.filter(p=>matchState.scores[p.id]===maxScore).map(p=>p.name).join(", ");
  openModal(`
    <h2>매치 종료</h2>
    <p class="sub" style="text-align:center;">총 ${matchState.currentRound}판 진행 · 내 팀 승리 ${myWins}회 / 패배 ${matchState.currentRound-myWins}회</p>
    <div class="resultBig win" style="font-size:20px;">🏆 최고 점수: ${winners} (${maxScore}점)</div>
    <table class="scoreTable">
      <tr><th>플레이어</th><th>최종 점수</th></tr>
      ${finalScoreRows}
    </table>
    <table class="scoreTable">
      <tr><th>판</th><th>여당</th><th>계약</th><th>득점</th><th>내 팀 결과</th></tr>
      ${rows}
    </table>
    <div class="modal-actions"><button class="btn" id="newMatchBtn">새 매치 시작</button></div>
  `);
  document.getElementById("newMatchBtn").onclick = ()=>{ closeModal(); matchState.history=[]; showRoundSetup(); };
}

/* ============================ 시작: 점수 및 판 수 설정 ============================ */
function showRoundSetup(){
  G = null;
  clearSavedGame();
  matchState.totalRounds = 1;
  matchState.currentRound = 0;
  matchState.nextDealer = Math.floor(Math.random()*5);
  matchState.endMode = "rounds";
  const presets = [1,3,5,7,9];
  const optHtml = presets.map(n=>`<div class="count-opt" data-n="${n}" style="width:44px;">${n}판</div>`).join("");
  onlineDisconnect(true);
  openModal(`
    <h2>마이티 시작</h2>
    <p class="sub" style="text-align:center;">게임 방식을 선택하세요.</p>
    <div class="modal-actions" style="display:flex;gap:10px;">
      <button class="btn" id="createOnlineRoomBtn" style="flex:1;">온라인게임</button>
      <button class="btn ghost" id="soloStartBtn" style="flex:1;">혼자시작</button>
    </div>
    <div id="soloSetupArea" style="display:none;">
    <p class="sub">시작 점수 (보통 50점)</p>
    <div class="row"><input type="number" id="startScoreInput" value="50" min="0" max="999" style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0000002a;color:var(--paper);font-size:14px;"></div>

    <p class="sub">종료 방식</p>
    <div class="row" id="endModeRow">
      <div class="suit-opt sel" data-mode="rounds" style="font-size:13px;">📅 정해진 판 수</div>
      <div class="suit-opt" data-mode="bust" style="font-size:13px;">💥 점수 소진 시까지</div>
    </div>

    <div id="roundCountSection">
      <p class="sub">몇 판을 진행할까요? 매판마다 딜러가 자동으로 바뀝니다.</p>
      <div class="count-row" id="roundRow">${optHtml}</div>
      <p class="sub">직접 입력</p>
      <div class="row"><input type="number" id="customRounds" min="1" max="99" placeholder="예: 4" style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#0000002a;color:var(--paper);font-size:14px;"></div>
    </div>
    <p class="sub" id="bustHint" style="display:none;">한 명이라도 점수가 0점 이하가 되면 그 판을 마지막으로 매치가 종료됩니다.</p>

    <div class="modal-actions"><button class="btn" id="startMatchBtn">게임 시작</button></div>
    </div>
  `);
  document.getElementById("createOnlineRoomBtn").onclick = ()=>{
    closeModal();
    showOnlineEntry();
  };
  document.getElementById("soloStartBtn").onclick = ()=>{
    document.getElementById("soloSetupArea").style.display = "block";
    document.getElementById("soloStartBtn").style.display = "none";
    document.getElementById("createOnlineRoomBtn").style.display = "none";
  };
  let chosenRounds = 1;
  let chosenMode = "rounds";
  document.querySelectorAll("#roundRow .count-opt").forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll("#roundRow .count-opt").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
      chosenRounds = parseInt(el.dataset.n,10);
      document.getElementById("customRounds").value="";
    };
  });
  document.getElementById("customRounds").addEventListener("input",(e)=>{
    const v = parseInt(e.target.value,10);
    if(v>=1){
      chosenRounds=v;
      document.querySelectorAll("#roundRow .count-opt").forEach(x=>x.classList.remove("sel"));
    }
  });
  document.querySelectorAll("#endModeRow .suit-opt").forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll("#endModeRow .suit-opt").forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel");
      chosenMode = el.dataset.mode;
      document.getElementById("roundCountSection").style.display = chosenMode==="rounds"? "" : "none";
      document.getElementById("bustHint").style.display = chosenMode==="bust"? "" : "none";
    };
  });
  document.getElementById("startMatchBtn").onclick = ()=>{
    const startScore = parseInt(document.getElementById("startScoreInput").value,10);
    matchState.startScore = isNaN(startScore)? 50 : startScore;
    matchState.scores = [0,1,2,3,4].map(()=>matchState.startScore);
    matchState.endMode = chosenMode;
    matchState.totalRounds = Math.max(1, Math.min(99, chosenRounds||1));
    closeModal();
    newGame();
  };
}

/* ============================ 저장/불러오기 (window.storage) ============================ */
function serializeG(g){
  if(!g) return null;
  const copy = {...g};
  copy.passedSet = [...g.passedSet];
  copy.exchangeSelected = g.exchangeSelected ? [...g.exchangeSelected] : undefined;
  return copy;
}
function deserializeG(obj){
  if(!obj) return null;
  const g = {...obj};
  g.passedSet = new Set(obj.passedSet||[]);
  g.exchangeSelected = obj.exchangeSelected ? new Set(obj.exchangeSelected) : undefined;
  return g;
}
let saveTimer=null;
function queueSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveGameState, 300);
}
async function saveGameState(){
  if(!G) return;
  if(onlineEnabled()) return; // 온라인 게임은 host/guest 세션 상태라 로컬 재접속으로 이어할 수 없으므로 저장하지 않음
  try{
    await window.storage.set("mighty_save", JSON.stringify({G:serializeG(G), matchState}), false);
  }catch(e){ /* 저장소를 사용할 수 없으면 조용히 무시 */ }
}
function flushSaveNow(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  saveGameState();
}
async function clearSavedGame(){
  try{ await window.storage.delete("mighty_save", false); }catch(e){ /* 이미 없거나 사용 불가 */ }
}

/* ============================ 저장된 상황 이어하기 ============================ */
function resumeGame(){
  render();
  if(G.phase==="bidding"){
    scheduleBidStep();
  } else if(G.phase==="exchange"){
    const d = G.players[G.declarer];
    if(d.isHuman){
      if(!G.exchangeSelected) G.exchangeSelected = new Set();
      renderExchangeUI();
    } else {
      const scored = d.hand.map(c=>({c,v:cardWeight(c)}));
      scored.sort((a,b)=>a.v-b.v);
      doExchange(scored.slice(0,3).map(x=>x.c));
    }
  } else if(G.phase==="friend"){
    const d = G.players[G.declarer];
    if(d.isHuman){
      renderFriendUI();
    } else {
      applyFriend(aiChooseFriendCondition(d.hand));
    }
  } else if(G.phase==="play"){
    scheduleTurn();
  } else if(G.phase==="result"){
    renderResultUI();
  }
}

/* ============================ 앱 초기화 ============================ */
(async function init(){
  document.getElementById("log").addEventListener("click", openLogModal);
  document.getElementById("newGameBtn").addEventListener("click", confirmNewGame);
  document.getElementById("sfxToggle").addEventListener("click", toggleSfx);
  document.getElementById("profileBackupBtn").addEventListener("click", showProfileBackupUI);
  loadSfxPref();
  // iOS Safari 등에서는 사용자의 첫 터치가 있어야 오디오가 재생 가능해지므로, 화면 첫 터치에서 오디오 컨텍스트를 깨워둠
  document.body.addEventListener("touchstart", ()=>getSfxCtx(), {once:true, passive:true});
  document.body.addEventListener("click", ()=>getSfxCtx(), {once:true});

  // 강제 종료/백그라운드 전환 등 언제 끊겨도 최신 상태가 저장되도록 즉시 플러시
  document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushSaveNow(); });
  // 다른 화면(앱/탭)에 나갔다가 돌아왔을 때, 온라인 연결이 끊겨있다면 예약된 대기시간을 기다리지 않고 바로 재접속을 시도한다.
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden) return;
    if(online.connected || online.ws) return;
    const room = online.room || (()=>{ try{ return localStorage.getItem("mighty_online_room")||""; }catch(e){ return ""; } })();
    const token = online.token || (()=>{ try{ return localStorage.getItem("mighty_online_token")||""; }catch(e){ return ""; } })();
    const nickname = online.nickname || (()=>{ try{ return localStorage.getItem("mighty_online_nickname")||""; }catch(e){ return ""; } })();
    if(!room || !token || !nickname) return;
    if(onlineReconnectTimer){ clearTimeout(onlineReconnectTimer); onlineReconnectTimer=null; }
    connectOnline(nickname, room, token, true);
  });
  window.addEventListener("pagehide", flushSaveNow);
  window.addEventListener("beforeunload", flushSaveNow);
  window.addEventListener("blur", flushSaveNow);

  await loadProfile();
  try{
    const res = await window.storage.get("mighty_save", false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      if(data && data.G && data.matchState){
        Object.assign(matchState, data.matchState);
        G = deserializeG(data.G);
        resumeGame();
        return;
      }
    }
  }catch(e){ /* 저장된 게임 없음 또는 저장소 사용 불가 */ }
  showRoundSetup();
})();

})();
